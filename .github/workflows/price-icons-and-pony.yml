name: Price icons and Ponyschnitt alignment

on:
  push:
    branches: ["main"]
    paths:
      - ".github/price-icons-and-pony.py"
      - ".github/workflows/price-icons-and-pony.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/price-icons-and-pony.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Align Ponyschnitt and replace price numbers with icons"
            git push
          fi

# trigger
