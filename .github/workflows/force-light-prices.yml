name: Force light price lists

on:
  push:
    branches: ["main"]
    paths:
      - ".github/force-light-prices.py"
      - ".github/workflows/force-light-prices.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/force-light-prices.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html impressum.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Force light price lists and bust CSS cache"
            git push
          fi
