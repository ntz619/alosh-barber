name: Fix carousel v5

on:
  push:
    branches: ["main"]
    paths:
      - ".github/fix_carousel_v5.py"
      - ".github/workflows/fix-carousel-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply carousel fix
        run: python .github/fix_carousel_v5.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js styles.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix seamless haircut carousel"
            git push
          fi

# trigger
