name: Apply real price lists

on:
  push:
    branches: ["main"]
    paths:
      - ".github/apply-real-prices.py"
      - ".github/workflows/apply-real-prices.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply price list content
        run: python .github/apply-real-prices.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use real Damen and Herren price lists"
            git push
          fi
