name: German translation cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/translate-site-de-finish.py"
      - ".github/workflows/translate-site-de-finish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/translate-site-de-finish.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finish German website translation"
            git push
          fi

# trigger
