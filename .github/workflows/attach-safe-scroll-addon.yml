name: Attach safe gender scroll addon

on:
  push:
    branches: ["main"]
    paths:
      - ".github/attach-safe-scroll-addon.py"
      - ".github/workflows/attach-safe-scroll-addon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/attach-safe-scroll-addon.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Attach safe gender scroll helper"
            git push
          fi
