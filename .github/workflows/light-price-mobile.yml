name: Light price lists and Damen mobile

on:
  push:
    branches: ["main"]
    paths:
      - ".github/light-price-mobile.py"
      - ".github/workflows/light-price-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply light price styles
        run: python .github/light-price-mobile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make price lists light and improve Damen mobile"
            git push
          fi
