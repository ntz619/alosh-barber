name: Apply site fixes

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/patch_site.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply Rostock and navigation fixes
        run: python .github/patch_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Rostock details and centered navigation"
            git push
          fi
