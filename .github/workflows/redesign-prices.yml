name: Redesign price lists

on:
  push:
    branches: ["main"]
    paths:
      - ".github/redesign-prices.py"
      - ".github/workflows/redesign-prices.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply price redesign
        run: python .github/redesign-prices.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Redesign Damen Herren price lists"
            git push
          fi
