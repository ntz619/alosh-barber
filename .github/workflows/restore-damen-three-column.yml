name: Restore Damen mobile three-column prices

on:
  push:
    branches: ["main"]
    paths:
      - ".github/restore-damen-three-column.py"
      - ".github/workflows/restore-damen-three-column.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Damen mobile layout
        run: python .github/restore-damen-three-column.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore Damen mobile three-column prices"
            git push
          fi

# trigger v2
