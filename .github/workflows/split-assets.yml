name: Split website assets

on:
  push:
    branches: ["main"]
    paths:
      - ".github/split_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Split HTML CSS and JavaScript
        run: python .github/split_assets.py
      - name: Commit separated assets and Impressum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js impressum.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Separate assets and add Impressum"
            git push
          fi
