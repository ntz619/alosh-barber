name: Fix carousel autoplay

on:
  push:
    branches: ["main"]
    paths:
      - ".github/fix_carousel_autoplay.py"
      - ".github/workflows/fix-carousel-autoplay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch carousel autoplay
        run: python .github/fix_carousel_autoplay.py
      - name: Commit carousel fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix haircut carousel autoplay"
            git push
          fi
