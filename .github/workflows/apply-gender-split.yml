name: Apply Damen Herren split

on:
  push:
    branches: ["main"]
    paths:
      - ".github/apply-gender-split.py"
      - ".github/workflows/apply-gender-split.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply split
        run: python .github/apply-gender-split.py
      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Damen Herren switcher"
            git push
          fi
