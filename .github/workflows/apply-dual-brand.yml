name: Apply ALOSH VIVO dual brand

on:
  push:
    branches: ["main"]
    paths:
      - ".github/apply-dual-brand.py"
      - ".github/workflows/apply-dual-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/apply-dual-brand.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Introduce ALOSH VIVO shared salon identity"
            git push
          fi

# trigger
